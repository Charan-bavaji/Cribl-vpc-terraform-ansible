---
- name: Create cribl service user
  user:
    name: cribl
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure install directory exists
  file:
    path: "{{ cribl_install_dir }}"
    state: directory
    owner: cribl
    group: cribl
    mode: "0755"

- name: Download Cribl package
  get_url:
    url: "{{ cribl_download_url }}"
    dest: /tmp/cribl.tgz
    mode: "0644"

- name: Extract Cribl
  unarchive:
    src: /tmp/cribl.tgz
    dest: /opt
    remote_src: true
    owner: cribl
    group: cribl

- name: Install systemd unit for Cribl
  template:
    src: cribl.service.j2
    dest: /etc/systemd/system/cribl.service
    mode: "0644"
  notify: restart cribl

- name: Enable and start Cribl
  systemd:
    name: cribl
    enabled: true
    state: started
    daemon_reload: true
